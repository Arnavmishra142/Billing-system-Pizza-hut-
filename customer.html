<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Order Menu — New Pizza Hut & Live Cake</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body { background: #0b0c10; color: #e3e6eb; min-height: 100dvh; padding-bottom: 90px; }

        /* ── HEADER ── */
        .cust-header {
            background: linear-gradient(135deg, #1a1d2e, #12151f);
            padding: 16px 20px 12px;
            border-bottom: 1px solid #1f2937;
            position: sticky; top: 0; z-index: 100;
        }
        .cust-header h1 { font-size: 1.1rem; font-weight: 800; color: #f97316; letter-spacing: 0.5px; }
        .cust-header .table-badge {
            display: inline-block; margin-top: 4px;
            background: #1f2937; color: #94a3b8;
            font-size: 0.8rem; padding: 3px 10px; border-radius: 20px;
        }
        .cust-header .table-badge span { color: #38bdf8; font-weight: 700; }

        /* ── CATEGORY TABS ── */
        .cat-tabs {
            display: flex; gap: 8px; padding: 12px 16px;
            overflow-x: auto; background: #111318;
            border-bottom: 1px solid #1f2937;
            scrollbar-width: none; position: sticky; top: 68px; z-index: 99;
        }
        .cat-tabs::-webkit-scrollbar { display: none; }
        .cat-tab {
            flex-shrink: 0; padding: 6px 16px; border-radius: 20px;
            border: 1.5px solid #374151; background: transparent;
            color: #9ca3af; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
            white-space: nowrap;
        }
        .cat-tab.active {
            background: #f97316; border-color: #f97316;
            color: white;
        }

        /* ── MENU ITEMS ── */
        .menu-section { padding: 12px 16px; }
        .section-title {
            font-size: 0.75rem; font-weight: 700; color: #4b5563;
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 10px; padding-left: 2px;
        }
        .items-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .item-card {
            display: flex; align-items: center; justify-content: space-between;
            background: #13161f; border: 1px solid #1f2937;
            border-radius: 12px; padding: 12px 14px;
            transition: border-color 0.2s;
        }
        .item-card.in-cart { border-color: #f97316; }
        .item-info { flex: 1; }
        .item-name { font-size: 0.95rem; font-weight: 600; color: #e2e8f0; }
        .item-price { font-size: 0.85rem; color: #10b981; font-weight: 700; margin-top: 2px; }

        /* qty control */
        .qty-ctrl { display: flex; align-items: center; gap: 8px; }
        .qty-btn {
            width: 32px; height: 32px; border-radius: 50%;
            border: none; font-size: 1.2rem; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
        }
        .qty-minus { background: #1f2937; color: #e2e8f0; }
        .qty-minus:active { background: #374151; }
        .qty-plus  { background: #f97316; color: white; }
        .qty-plus:active  { background: #ea580c; }
        .qty-num { font-size: 1rem; font-weight: 700; min-width: 20px; text-align: center; color: #f1f5f9; }

        /* ── BOTTOM CART BAR ── */
        .cart-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #f97316; padding: 14px 20px;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 200; transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
            border-radius: 16px 16px 0 0;
        }
        .cart-bar.visible { transform: translateY(0); }
        .cart-bar-info { color: white; }
        .cart-bar-items { font-size: 0.8rem; opacity: 0.9; }
        .cart-bar-total { font-size: 1.2rem; font-weight: 800; }
        .cart-bar-btn {
            background: white; color: #f97316;
            border: none; border-radius: 10px;
            padding: 10px 20px; font-size: 1rem; font-weight: 800;
            cursor: pointer;
        }
        .cart-bar-btn:active { transform: scale(0.96); }

        /* ── SUCCESS SCREEN ── */
        #successScreen {
            display: none; position: fixed; inset: 0;
            background: #0b0c10; z-index: 1000;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 30px;
        }
        #successScreen.show { display: flex; }
        .success-icon { font-size: 4rem; margin-bottom: 20px; animation: bounce 0.6s ease; }
        @keyframes bounce { 0%{transform:scale(0)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }
        .success-title { font-size: 1.6rem; font-weight: 800; color: #10b981; margin-bottom: 10px; }
        .success-sub { color: #6b7280; font-size: 0.95rem; line-height: 1.6; }
        .success-table { 
            margin-top: 20px; background: #13161f;
            border: 1px solid #1f2937; border-radius: 12px;
            padding: 12px 20px; color: #38bdf8; font-weight: 700;
        }
        .order-again-btn {
            margin-top: 30px; background: #f97316; color: white;
            border: none; border-radius: 12px; padding: 14px 30px;
            font-size: 1rem; font-weight: 700; cursor: pointer;
        }

        /* ── LOADING ── */
        .loading { text-align: center; padding: 60px 20px; color: #4b5563; }
        .loading-spinner {
            width: 36px; height: 36px; border: 3px solid #1f2937;
            border-top-color: #f97316; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── EMPTY STATE ── */
        .empty-menu { text-align: center; padding: 60px 20px; color: #4b5563; font-size: 0.95rem; }

        /* ── OUT OF STOCK ── */
        .item-card.oos {
            opacity: 0.55;
        }
        /* Hide qty controls but keep the card scrollable/visible */
        .item-card.oos .qty-ctrl { display: none; }
        .item-card.oos .qty-btn  { pointer-events: none; }
        .oos-label {
            font-size: 0.72rem; font-weight: 700;
            color: #ef4444;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 5px; padding: 2px 8px;
            margin-top: 4px; display: inline-block;
        }
    </style>
</head>
<body>

<div class="cust-header">
    <h1>🍕 New Pizza Hut & Live Cake</h1>
    <div class="table-badge">You are at: <span id="tableLabel">Loading…</span></div>
</div>

<div class="cat-tabs" id="catTabs"></div>

<div id="menuContainer">
    <div class="loading">
        <div class="loading-spinner"></div>
        Loading menu…
    </div>
</div>

<!-- Cart Bottom Bar -->
<div class="cart-bar" id="cartBar">
    <div class="cart-bar-info">
        <div class="cart-bar-items" id="cartBarItems">0 items</div>
        <div class="cart-bar-total" id="cartBarTotal">₹0</div>
    </div>
    <button class="cart-bar-btn" id="placeOrderBtn">Place Order →</button>
</div>

<!-- Success Screen -->
<div id="successScreen">
    <div class="success-icon">✅</div>
    <div class="success-title">Order Placed!</div>
    <div class="success-sub">Your order has been sent to the kitchen.<br>Staff will prepare it shortly.</div>
    <div class="success-table" id="successTableLabel"></div>
    <button class="order-again-btn" onclick="location.reload()">Order More Items</button>
</div>

<script type="module">
import { initializeApp }    from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import {
    getFirestore,
    collection, doc, onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
import { getAuth, signInAnonymously }
    from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { getFunctions, httpsCallable }
    from "https://www.gstatic.com/firebasejs/10.8.1/firebase-functions.js";

// ── Firebase init ──────────────────────────────────────────
const app = initializeApp({
    apiKey: "AIzaSyBLzGd0DlItKShk0eJoQR4CjRx1sP3-o-w",
    authDomain: "billing-system-f8531.firebaseapp.com",
    projectId: "billing-system-f8531",
    storageBucket: "billing-system-f8531.firebasestorage.app",
    messagingSenderId: "921228841270",
    appId: "1:921228841270:web:9013d59b3ef96dda40e397"
});
const db        = getFirestore(app);
const auth      = getAuth(app);
// Region must match Cloud Function deployment region
const fnClient  = getFunctions(app, 'asia-south1');

// ── Anonymous Auth — gives each customer a server-issued UID ─────────────
// signInAnonymously is idempotent: if the browser already has an anonymous
// session the SDK returns the existing user without creating a new one.
let _authReady = false;
signInAnonymously(auth)
    .then(() => { _authReady = true; })
    .catch(err => console.warn('[Auth] anonymous sign-in failed:', err));

// ── Table from URL ─────────────────────────────────────────
const params    = new URLSearchParams(location.search);
const rawTable  = params.get('table');
const tableName = rawTable ? decodeURIComponent(rawTable) : 'Unknown Table';
document.getElementById('tableLabel').textContent = tableName;
document.title = `Order — ${tableName}`;

// ── State ──────────────────────────────────────────────────
let cart         = {};   // { itemId: qty }
let menuMap      = {};   // { itemId: {name, price, category, inStock} }
let allCategories = [];
let pizzaSizes   = { regular: true, medium: true, large: true }; // from settings/pizza_sizes
let _lastByCat   = {};   // last rendered byCat — used to re-render on size change

// ── Pizza helpers ───────────────────────────────────────────
function isPizzaVariant(item) {
    return (item.category || '').toLowerCase() === 'pizza' &&
        /\(\s*(regular|medium|large)\s*\)/i.test(item.name || '');
}
function getPizzaSize(item) {
    if (/\(\s*regular\s*\)/i.test(item.name || '')) return 'regular';
    if (/\(\s*medium\s*\)/i.test(item.name || ''))  return 'medium';
    if (/\(\s*large\s*\)/i.test(item.name || ''))   return 'large';
    return null;
}

// ── Real-time listeners ─────────────────────────────────────
// 1. Menu items — re-renders whenever any item changes
// 2. Pizza sizes — re-renders whenever admin toggles a size in/out
function loadMenu() {
    // ── Menu items listener ──
    const q = query(collection(db, 'menu_items'), orderBy('category'));
    onSnapshot(q, (snap) => {
        const byCat = {};
        menuMap = {};
        snap.forEach(d => {
            const item = { id: d.id, ...d.data() };
            menuMap[d.id] = item;
            const cat = item.category || 'Other';
            if (!byCat[cat]) byCat[cat] = [];
            byCat[cat].push(item);
        });
        _lastByCat      = byCat;
        allCategories   = Object.keys(byCat).sort();
        renderCatTabs(allCategories);
        renderMenu(byCat);
        restoreCartCounts();
    }, () => {
        document.getElementById('menuContainer').innerHTML =
            `<div class="empty-menu">⚠️ Menu load failed.<br>Please check your connection.</div>`;
    });

    // ── Pizza sizes listener ──
    // When admin toggles Regular/Medium/Large, re-render to show/hide OOS badge
    onSnapshot(doc(db, 'settings', 'pizza_sizes'), (snap) => {
        pizzaSizes = snap.exists()
            ? { regular: true, medium: true, large: true, ...snap.data() }
            : { regular: true, medium: true, large: true };
        if (Object.keys(_lastByCat).length > 0) {
            renderMenu(_lastByCat);
            restoreCartCounts();
        }
    });
}

function renderCatTabs(cats) {
    const tabs = document.getElementById('catTabs');
    // Preserve the active tab
    const activeCat = tabs.querySelector('.cat-tab.active')?.textContent || '';
    tabs.innerHTML = '';
    cats.forEach((cat, i) => {
        const btn = document.createElement('button');
        const isActive = activeCat ? cat === activeCat : i === 0;
        btn.className = 'cat-tab' + (isActive ? ' active' : '');
        btn.textContent = cat;
        btn.addEventListener('click', () => {
            document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            const section = document.getElementById('sec-' + CSS.escape(cat));
            if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        tabs.appendChild(btn);
    });
}

function renderMenu(byCat) {
    const container = document.getElementById('menuContainer');
    // Preserve scroll position so re-renders don't jump
    const scrollY = window.scrollY;
    container.innerHTML = '';
    Object.entries(byCat).sort(([a],[b]) => a.localeCompare(b)).forEach(([cat, items]) => {
        const section = document.createElement('div');
        section.className = 'menu-section';
        section.id = 'sec-' + cat;
        section.innerHTML = `<div class="section-title">${cat}</div><div class="items-list" id="list-${cat}"></div>`;
        container.appendChild(section);
        const list = section.querySelector('.items-list');
        items.forEach(item => list.appendChild(buildItemCard(item)));
    });
    window.scrollTo({ top: scrollY, behavior: 'instant' });
}

function buildItemCard(item) {
    // Pizza variants: availability is controlled by size, not individual inStock
    let isAvailable;
    if (isPizzaVariant(item)) {
        const size = getPizzaSize(item);
        isAvailable = size ? pizzaSizes[size] !== false : item.inStock !== false;
    } else {
        isAvailable = item.inStock !== false; // undefined/true = available
    }

    const card = document.createElement('div');
    card.className = 'item-card' + (isAvailable ? '' : ' oos');
    card.id = 'card-' + item.id;
    card.innerHTML = `
        <div class="item-info">
            <div class="item-name">${esc(item.name)}</div>
            <div class="item-price">₹${item.price}</div>
            ${!isAvailable ? '<div class="oos-label">Out of Stock</div>' : ''}
        </div>
        ${isAvailable ? `
        <div class="qty-ctrl">
            <button class="qty-btn qty-minus" data-id="${item.id}">−</button>
            <span class="qty-num" id="qty-${item.id}">0</span>
            <button class="qty-btn qty-plus" data-id="${item.id}">+</button>
        </div>` : ''}
    `;
    if (isAvailable) {
        card.querySelector('.qty-plus').addEventListener('click', () => changeQty(item.id, 1));
        card.querySelector('.qty-minus').addEventListener('click', () => changeQty(item.id, -1));
    }
    return card;
}

/** Restore cart quantity labels after a menu re-render. */
function restoreCartCounts() {
    Object.entries(cart).forEach(([id, qty]) => {
        const el = document.getElementById('qty-' + id);
        if (el) el.textContent = qty;
        const card = document.getElementById('card-' + id);
        if (card) card.classList.toggle('in-cart', qty > 0);
    });
    updateCartBar();
}

function esc(s = '') {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function changeQty(id, delta) {
    const current = cart[id] || 0;
    const newQty = Math.max(0, current + delta);
    if (newQty === 0) delete cart[id]; else cart[id] = newQty;
    document.getElementById('qty-' + id).textContent = newQty;
    const card = document.getElementById('card-' + id);
    if (card) card.classList.toggle('in-cart', newQty > 0);
    updateCartBar();
}

function updateCartBar() {
    const bar = document.getElementById('cartBar');
    const totalItems = Object.values(cart).reduce((s,q) => s+q, 0);
    const totalPrice = Object.entries(cart).reduce((s,[id,qty]) => s + (menuMap[id]?.price||0)*qty, 0);
    if (totalItems === 0) {
        bar.classList.remove('visible');
    } else {
        bar.classList.add('visible');
        document.getElementById('cartBarItems').textContent = `${totalItems} item${totalItems>1?'s':''}`;
        document.getElementById('cartBarTotal').textContent = `₹${totalPrice}`;
    }
}

// ── Place Order ────────────────────────────────────────────
// Orders are created via the createCustomerOrder Cloud Function, NOT by
// writing directly to pending_table_orders.  The function:
//   1. Validates the anonymous Firebase Auth UID (server-issued, unforgeable)
//   2. Acquires or reuses the table lock atomically
//   3. Returns the authoritative tableId (may differ from URL if lock exists)
document.getElementById('placeOrderBtn').addEventListener('click', async () => {
    const totalItems = Object.values(cart).reduce((s,q) => s+q, 0);
    if (totalItems === 0) return;

    const btn = document.getElementById('placeOrderBtn');
    btn.textContent = 'Sending…';
    btn.disabled = true;

    const items = Object.entries(cart).map(([id, qty]) => ({
        itemId:   id,
        name:     menuMap[id].name,
        price:    menuMap[id].price,
        quantity: qty
    }));

    try {
        // Ensure anonymous auth is ready before calling the function
        if (!_authReady) {
            await signInAnonymously(auth);
            _authReady = true;
        }

        const createOrder = httpsCallable(fnClient, 'createCustomerOrder');
        const result = await createOrder({
            requestedTableId: tableName,   // may be overridden by an existing lock
            customer:         {},          // name/phone not collected on this panel
            items
        });

        // Use the server-returned tableId as the authoritative assigned table
        const assignedTable = result.data.tableId || tableName;

        // Show success screen
        cart = {};
        document.getElementById('successTableLabel').textContent = `📍 ${assignedTable}`;
        const successScreen = document.getElementById('successScreen');
        successScreen.classList.add('show');
    } catch(e) {
        console.error('[PlaceOrder] failed:', e);
        btn.textContent = 'Place Order →';
        btn.disabled = false;
        const msg = e.code === 'functions/already-exists'
            ? 'This table is currently occupied. Please wait or choose another.'
            : e.code === 'functions/not-found'
            ? 'Table not found. Please scan the QR code again.'
            : 'Order failed. Please check your connection and try again.';
        alert(msg);
    }
});

loadMenu();
</script>
</body>
</html>
